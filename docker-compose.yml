services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: career-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_os
    ports:
      - "5433:5432"
    volumes:
      - career-os-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_os"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  career-os-postgres-data:
